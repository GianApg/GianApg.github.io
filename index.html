<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giancarlo Apango</title>
    <!-- Cargar Tailwind CSS para el estilo moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para la estética Dark Mode */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117; /* Fondo Estilo GitHub Dark Mode */
            overflow-x: hidden;
        }
        .hero-background {
            /* Gradiente radial sutil para profundidad */
            background: radial-gradient(circle at 50% 10%, #1f2a37 0%, #0d1117 80%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Animación para el efecto de máquina de escribir */
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #6ee7b7; } /* green-300 */
        }
        .typewriter-text {
            overflow: hidden;
            border-right: .15em solid #6ee7b7;
            white-space: nowrap;
            margin: 0 auto;
            letter-spacing: .05em;
            animation: 
                typing 3.5s steps(40, end),
                blink-caret .75s step-end infinite;
        }
        /* Efecto de brillo sutil para la tarjeta principal */
        .glow-card {
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1), 
                0 2px 4px -2px rgba(0, 0, 0, 0.1),
                0 0 40px rgba(16, 185, 129, 0.2);
            backdrop-filter: blur(8px);
            background-color: rgba(30, 41, 59, 0.6);
            /* Asegura que las transiciones de JS sean suaves */
            transition: transform 0.5s ease-out, box-shadow 0.5s ease-out; 
        }
    </style>
</head>
<body class="text-white">

    <div class="hero-background">
        <div class="max-w-4xl w-full mx-auto p-6 md:p-10">

            <!-- Tarjeta de Encabezado Profesional -->
            <div id="header-card" class="glow-card rounded-xl p-8 md:p-12 transition duration-500 hover:shadow-xl">
                
                <!-- Sección de Perfil -->
                <div class="flex flex-col md:flex-row items-center md:items-start space-y-6 md:space-y-0 md:space-x-8">
                    
                    <!-- Avatar y Nombre -->
                    <div class="flex-shrink-0">
                        <img 
                            src="https://placehold.co/120x120/10b981/ffffff?text=GA" 
                            onerror="this.onerror=null; this.src='https://placehold.co/120x120/10b981/ffffff?text=GA'"
                            alt="Marcador de Posición de Foto de Perfil (GA)" 
                            class="w-24 h-24 md:w-32 md:h-32 rounded-full ring-4 ring-green-500/50 object-cover">
                    </div>

                    <!-- Texto de Introducción Principal -->
                    <div class="text-center md:text-left">
                        <p class="text-sm font-medium text-green-400 uppercase tracking-widest mb-1">Página de Portafolio</p>
                        <h1 class="text-4xl md:text-5xl font-extrabold text-white leading-tight">
                            Hola, soy <span class="text-green-400">Giancarlo Apango</span>.
                        </h1>
                        <h2 class="text-xl md:text-2xl font-light text-gray-300 mt-2">
                            Hola.
                        </h2>
                        
                        <!-- Lema Interactivo/Fascinante con efecto de máquina de escribir -->
                        <div class="mt-4 md:mt-6">
                            <p class="typewriter-text text-lg text-teal-300 max-w-full md:max-w-xl border-r pr-2">
                                Bienvenido a mi página.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Biografía y Llamada a la Acción -->
                <div class="mt-8 pt-6 border-t border-gray-700/50">
                    <p class="text-gray-400 text-base md:text-lg mb-6">
                        Hola
                    </p>

                    <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4">
                        
                        <!-- CTA Principal: Descargar Currículum -->
                        <button onclick="handleDownloadResume()" class="flex-1 text-center bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 shadow-lg shadow-green-500/30 active:scale-[.98]">
                            Descargar Currículum Completo (PDF)
                        </button>
                        
                        <!-- CTA Secundaria: Ver Proyectos -->
                        <a href="#projects-section" class="flex-1 text-center bg-slate-700 hover:bg-slate-600 text-gray-200 font-bold py-3 px-6 rounded-lg transition duration-300 border border-slate-600 active:scale-[.98]">
                            Explorar Mi Trabajo
                        </a>
                    </div>
                </div>

                <!-- Enlaces de Pie de Página/Contacto (Actualizados) -->
                <div class="mt-8 text-center text-gray-500 text-sm">
                    <p class="mb-2">Conecta conmigo:</p>
                    <div class="flex justify-center space-x-6">
                        <!-- LinkedIn -->
                        <a href="https://linkedin.com/in/giancarlo-apango-lozano-5338b434b" target="_blank" class="hover:text-green-400 transition duration-200">
                            LinkedIn
                        </a>
                        <!-- GitHub -->
                        <a href="https://github.com/GianApg" target="_blank" class="hover:text-green-400 transition duration-200">
                            GitHub
                        </a>
                        <!-- Email -->
                        <a href="mailto:apg.lon.giancarlo@gmail.com" class="hover:text-green-400 transition duration-200">
                            apg.lon.giancarlo@gmail.com
                        </a>
                    </div>
                </div>

            </div>

            <!-- Caja de Mensajes (Modal sutil en lugar de alert) -->
            <div id="message-box" class="fixed bottom-5 right-5 p-4 bg-green-600 text-white rounded-lg shadow-2xl opacity-0 transition-opacity duration-300 z-50">
                
            </div>
        </div>
    </div>

    <script>
        /**
         * Función que maneja la descarga del Currículum.
         * Muestra un mensaje temporal y simula la descarga del archivo 'Curriculum.pdf'.
         */
        function handleDownloadResume() {
            showMessage('¡El proceso de descarga del currículum comenzaría aquí!', 3000);
            
            // Simulación de descarga: crea un enlace temporal y hace clic en él
            const resumePath = 'Curriculum.pdf';
            const link = document.createElement('a');
            link.href = resumePath;
            link.download = 'Curriculum.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        /**
         * Muestra un mensaje temporal en una caja en la esquina inferior derecha.
         * @param {string} message - El mensaje a mostrar.
         * @param {number} duration - Duración en milisegundos.
         */
        function showMessage(message, duration = 2000) {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = message;
            msgBox.classList.remove('opacity-0');
            msgBox.classList.add('opacity-100');
            
            setTimeout(() => {
                msgBox.classList.remove('opacity-100');
                msgBox.classList.add('opacity-0');
            }, duration);
        }

        /**
         * Añade un efecto 3D sutil a la tarjeta cuando el cursor se mueve (solo en escritorio).
         */
        const card = document.getElementById('header-card');

        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Calcula la rotación para dar un efecto de profundidad 3D
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = (y - centerY) / 50; 
                const rotateY = (centerX - x) / 50;

                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
            });

            document.addEventListener('mouseleave', () => {
                // Restablecer tarjeta al salir el ratón
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)';
            });
        }
    </script>
</body>
</html>
